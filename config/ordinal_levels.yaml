# Ordinal codes (Sec 3.4: frequency items, education, income; food portions per
# the Phase 0 decision). Each scale lists its levels from lowest to highest and
# they are coded 0, 1, 2, ... Matching is on normalized text (casefolded,
# whitespace collapsed; the latin-1 en dash is read as "-", and "?" in "?1x/hari"
# is the "≥" sign lost in the export). Levels under `missing` become NaN.
# Every raw value of every ordinal column must match a level or a missing entry.

scales:
  education:     ["Tidak tamat SD", "SD", "SMP", "SMA/SMK", "Diploma/S1", "Lebih tinggi dari S1 (S2/S3/Profesi)"]
  income:        ["<1 juta", "1-2 juta", "2-3 juta", ">3 juta"]
  hfias:         ["Tidak", "Jarang (1-2x)", "Kadang-kadang (3-10x)", "Sering (>10x)"]
  counselling:   ["Tidak pernah", "Pernah sekali", "2-3 kali", ">3 kali"]
  aid_frequency: ["Tidak menerima", "1x/bulan", "2-3x/bulan", ">4x/bulan"]
  handwashing:   ["Tidak pernah", "Kadang-kadang", "Selalu"]
  food_washing:  ["Tidak pernah", "Kadang-kadang", "Selalu dicuci bersih"]
  meals:         ["1x", "1-2x", "2-3x", ">3x"]
  snacks:        ["Tidak pernah", "1x", "2-3x", ">3x"]
  walking_days:  ["Tidak pernah", "1-2 hari", "3-5 hari", "Setiap hari"]
  chores:        ["Tidak", "Jarang", "Cukup sering", "Setiap hari"]
  exercise:      ["Tidak pernah", "Ya, sesekali", "Ya, rutin"]
  ffq_frequency: ["Tidak pernah", "1-3x/bulan", "1x/minggu", "2-3x/minggu", "4-6x/minggu", "?1x/hari"]
  portion_animal: ["Tidak pernah", "1 potong/ekor/butir", "2 potong/ekor/butir", "3 potong/ekor/butir", ">3 potong/ekor/butir"]
  portion_plant:  ["Tidak pernah", "1 potong/buah/mangkuk", "2 potong/buah/mangkuk", "3 potong/buah/mangkuk", ">3 potong/buah/mangkuk"]
  portion_veg:    ["Tidak pernah", "1 mangkuk/buah", "2 mangkuk/buah", "3 mangkuk/buah", ">3 mangkuk/buah"]
  portion_glass:  ["Tidak pernah", "1 gelas", "2 gelas", "3 gelas", ">3 gelas"]
  portion_other:  ["Tidak pernah", "1 gelas/butir", "2 gelas/butir", "3 gelas/butir", ">3 gelas/butir"]

missing: ["Tidak tahu"]

